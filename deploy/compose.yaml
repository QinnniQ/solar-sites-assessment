services:
  solar-sites:
    image: solar-sites-assessment:0d51ded
    container_name: solar-sites-assessment
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      SOLAR_COOKIE_SECURE: "1"
      SOLAR_DB_PATH: /data/solar.db
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - solar-sites-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 320m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  solar-sites-data:
